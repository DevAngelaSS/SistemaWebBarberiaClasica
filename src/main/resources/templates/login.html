<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Iniciar Sesión | BarberPro</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style-public.css}">
    <style>
        :root {
            --gold: #8b5a2b;
            --gold-light: #a6713a;
            --gold-dark: #5c4033;
            --bg: #f7f3ef;
            --bg-card: #ffffff;
            --text: #3b2a20;
            --text-muted: rgba(59, 42, 32, 0.6);
            --border: rgba(139, 90, 43, 0.25);
        }

        body {
            background: linear-gradient(135deg, #f7f3ef 0%, #efe6df 100%);
            color: #3b2a20;
        }

        .auth-card {
            background-color: #ffffff;
            border: 1px solid rgba(139, 90, 43, 0.25);
            border-top: 4px solid #8b5a2b;
            box-shadow: 0 20px 50px rgba(59, 42, 32, 0.15);
        }

        .auth-card .form-label {
            color: #5c4033;
            letter-spacing: 0.5px;
        }

        .auth-card .form-control {
            background-color: #ffffff !important;
            border: 1px solid rgba(59, 42, 32, 0.2) !important;
            color: #3b2a20 !important;
        }

        .auth-card .form-control::placeholder {
            color: rgba(59, 42, 32, 0.4);
        }

        .auth-card .form-control:focus {
            border-color: #8b5a2b !important;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.15) !important;
        }

        .btn-ojo {
            background: #efe6df;
            border: 1px solid rgba(59, 42, 32, 0.2);
            border-left: none;
            color: #5c4033;
            border-radius: 0 6px 6px 0;
            padding: 0 14px;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }

        .btn-ojo:hover {
            color: #8b5a2b;
            background: #e4d6cb;
        }

        .input-group .form-control {
            border-right: none !important;
            border-radius: 6px 0 0 6px !important;
        }

        .auth-card .btn-gold {
            background: linear-gradient(135deg, #8b5a2b, #5c4033);
            color: #ffffff !important;
            letter-spacing: 1px;
        }

        .auth-card .btn-gold:hover {
            background: linear-gradient(135deg, #a6713a, #8b5a2b);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.3);
        }

        .auth-card .alert-danger {
            background: rgba(192, 57, 43, 0.08) !important;
            border: 1px solid rgba(192, 57, 43, 0.3) !important;
            color: #a52f23 !important;
        }

        .auth-card .alert-success {
            background: rgba(46, 139, 87, 0.1);
            border: 1px solid rgba(46, 139, 87, 0.3);
            color: #1f6f46;
        }

        .auth-card .alert-warning {
            background: rgba(183, 121, 31, 0.12);
            border: 1px solid rgba(183, 121, 31, 0.4);
            color: #8a5a00;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="auth-card" style="max-width: 420px;">
        <div class="text-center mb-4">
            <h2 style="font-family:'Playfair Display'; color:var(--gold);">
                <i class="fa-solid fa-scissors me-2"></i>Barberia La Clasica
            </h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Bienvenido de nuevo, estimado cliente</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger"
            style="background:rgba(231,76,60,0.1); border:1px solid #e74c3c; color:#e74c3c;">
            Correo o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente.
        </div>
        <div th:if="${param.accesoDenegado}" class="alert alert-warning">
            No tienes permiso para acceder a ese módulo.
        </div>
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <form th:action="@{/cliente/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                <input type="email" name="username" class="form-control" placeholder="tu@correo.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">CONTRASEÑA</label>
                <!-- ← input-group con botón ojo -->
                <div class="input-group">
                    <input type="password" id="loginPassword" name="password" class="form-control"
                        placeholder="••••••••" required>
                    <button type="button" class="btn-ojo" onclick="toggleLoginPassword()"
                        title="Mostrar / ocultar contraseña">
                        <i id="iconoOjoLogin" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-gold w-100 py-3">
                INGRESAR A MI CUENTA
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="small" style="color:var(--text-muted);">
                ¿Aún no tienes cuenta?
                <a href="/cliente/registro" style="color:var(--gold); text-decoration:none;" class="fw-bold">Regístrate
                    aquí</a>
            </p>
            <a href="/" style="color:var(--gold); text-decoration:none;" class="small">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
            </a>
        </div>
    </div>

    <script>
        function toggleLoginPassword() {
            const input = document.getElementById('loginPassword');
            const icono = document.getElementById('iconoOjoLogin');
            if (input.type === 'password') {
                input.type = 'text';
                icono.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icono.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
