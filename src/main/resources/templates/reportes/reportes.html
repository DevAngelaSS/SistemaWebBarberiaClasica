<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reportes | La Clásica</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='reportes')}"></div>

    <div class="main-content pt-4">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="fw-bold m-0" style="color:var(--text-primary);">
                        <i class="fa-solid fa-chart-line me-2" style="color:var(--accent)"></i>Reportes
                    </h2>
                    <p class="text-muted m-0 small">Ingresos por citas completadas en el rango seleccionado.</p>
                </div>

                <form th:action="@{/admin/reportes}" method="get" class="d-flex align-items-end gap-2">
                    <div>
                        <label class="form-label small mb-1">Desde</label>
                        <input type="date" name="desde" class="form-control" th:value="${desde}">
                    </div>
                    <div>
                        <label class="form-label small mb-1">Hasta</label>
                        <input type="date" name="hasta" class="form-control" th:value="${hasta}">
                    </div>
                    <button type="submit" class="btn btn-primary fw-bold">
                        <i class="fa-solid fa-filter me-1"></i>Filtrar
                    </button>
                </form>
            </div>

            <!-- Tarjetas resumen -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="icon-box bg-primary-subtle text-primary"><i class="fa-solid fa-sack-dollar"></i></div>
                            <div>
                                <h6 class="text-muted mb-1 text-uppercase">Ingresos</h6>
                                <h2 class="mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(resumen.ingresos, 1, 2)}">S/ 0.00</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="icon-box bg-purple-subtle text-purple"><i class="fa-solid fa-scissors"></i></div>
                            <div>
                                <h6 class="text-muted mb-1 text-uppercase">Citas completadas</h6>
                                <h2 class="mb-0" th:text="${resumen.cantidad}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card shadow-sm">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="icon-box bg-primary-subtle text-primary"><i class="fa-solid fa-receipt"></i></div>
                            <div>
                                <h6 class="text-muted mb-1 text-uppercase">Ticket promedio</h6>
                                <h2 class="mb-0" th:text="'S/ ' + ${#numbers.formatDecimal(resumen.ticketPromedio, 1, 2)}">S/ 0.00</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Estado de citas -->
            <div class="d-flex flex-wrap gap-2 mb-4">
                <span th:each="e : ${porEstado}" class="badge bg-light border px-3 py-2">
                    <span th:text="${e.key}"></span>:
                    <strong th:text="${e.value}">0</strong>
                </span>
            </div>

            <!-- Gráfico por día -->
            <div class="card shadow-sm border-0 rounded-3 mb-4">
                <div class="card-header fw-bold">Ingresos por día</div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(porDia)}" class="text-center text-muted py-4">
                        <i class="fa-solid fa-chart-column d-block fs-2 mb-2 opacity-25"></i>
                        No hay ingresos en este rango.
                    </div>
                    <canvas id="graficoDia" height="90" th:unless="${#lists.isEmpty(porDia)}"></canvas>
                </div>
            </div>

            <div class="row g-4">
                <!-- Por barbero -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-3 h-100">
                        <div class="card-header fw-bold">Por barbero</div>
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="text-uppercase small">
                                    <tr><th class="ps-4">Barbero</th><th>Citas</th><th>Total</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="b : ${porBarbero}">
                                        <td class="ps-4 fw-semibold" th:text="${b.etiqueta}">—</td>
                                        <td th:text="${b.cantidad}">0</td>
                                        <td class="fw-bold" style="color:var(--accent);"
                                            th:text="'S/ ' + ${#numbers.formatDecimal(b.total, 1, 2)}">—</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(porBarbero)}">
                                        <td colspan="3" class="text-center text-muted py-4">Sin datos.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Por servicio -->
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-3 h-100">
                        <div class="card-header fw-bold">Por servicio</div>
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="text-uppercase small">
                                    <tr><th class="ps-4">Servicio</th><th>Citas</th><th>Total</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="s : ${porServicio}">
                                        <td class="ps-4 fw-semibold" th:text="${s.etiqueta}">—</td>
                                        <td th:text="${s.cantidad}">0</td>
                                        <td class="fw-bold" style="color:var(--accent);"
                                            th:text="'S/ ' + ${#numbers.formatDecimal(s.total, 1, 2)}">—</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(porServicio)}">
                                        <td colspan="3" class="text-center text-muted py-4">Sin datos.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels = /*[[${labelsDia}]]*/ [];
        const valores = /*[[${valoresDia}]]*/ [];
        const canvas = document.getElementById('graficoDia');
        if (canvas && labels.length) {
            new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ingresos (S/)',
                        data: valores,
                        backgroundColor: '#8b5a2b',
                        borderRadius: 6
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
    </script>
</body>

</html>
